name: Automated API Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: checking_account
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Test Automation Repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Clone and Start Target API Application
        run: |
          git clone https://github.com api-repo
          cd api-repo
          if [ -f docker-compose.yml ] || [ -f docker/docker-compose.yml ]; then
            docker compose up -d || true
          else
            mvn clean package -DskipTests
            nohup java -jar target/*.jar > app.log 2>&1 &
          fi
          cd ..

      - name: Wait for Target API to be Operational
        run: |
          echo "Waiting for API endpoint availability..."
          timeout 90s sh -c 'until curl -f http://localhost:8080/actuator/health || curl -f http://localhost:8080/health || curl -f http://127.0.0; do sleep 5; done' || echo "Proceeding to testing suite execution..."

      - name: Run test automation suite
        run: mvn clean test
        continue-on-error: true

      - name: Tear Down Infrastructure Environment
        if: always()
        run: |
          if [ -d api-repo ]; then
            cd api-repo
            docker compose down || true
            cd ..
          fi

      - name: Get Allure history
        uses: actions/checkout@v4
        if: always()
        with:
          ref: gh-pages
          path: gh-pages-dir
        continue-on-error: true

      - name: Generate Allure Report
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          allure_results: target/allure-results
          allure_history: allure-history
          keep_reports: 20

      - name: Deploy Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-history
          publish_branch: gh-pages
