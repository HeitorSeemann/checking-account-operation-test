name: Automated API Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      zookeeper:
        image: confluentinc/cp-zookeeper:7.3.0
        env:
          ZOOKEEPER_CLIENT_PORT: 2181
          ZOOKEEPER_TICK_TIME: 2000
        ports:
          - 2181:2181

      kafka:
        image: confluentinc/cp-kafka:7.3.0
        ports:
          - 9092:9092
        env:
          KAFKA_BROKER_ID: 1
          KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

    steps:
      - name: Checkout Test Automation Repository
        uses: actions/checkout@v4

      - name: Set up JDK 25 for Automation Suite
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Checkout Target API Source Code
        uses: actions/checkout@v4
        with:
          repository: HeitorSeemann/checking-account-operation
          path: api-target

      - name: Set up JDK 25 for Target API Build
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Wait for Kafka Broker and Provision Core Topics
        run: |
          echo "Waiting for Kafka network sockets to accept connections..."
          timeout 60s sh -c 'until nc -z 127.0.0.1 9092; do sleep 2; done'
          echo "Provisioning checking account core topics..."
          docker run --net=host confluentinc/cp-kafka:7.3.0 /usr/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --create --topic account-withdrawals --partitions 1 --replication-factor 1 --if-not-exists

      - name: Clean Local Environment Hardcoded Paths
        run: |
          cd api-target
          if [ -f gradle.properties ]; then
            sed -i '/org.gradle.java.home/d' gradle.properties
          fi
          cd ..

      - name: Compile and Launch Target API
        run: |
          cd api-target
          chmod +x gradlew
          ./gradlew compileJava
          nohup ./gradlew bootRun --args='--spring.kafka.bootstrap-servers=127.0.0.1:9092' > ../app.log 2>&1 &
          cd ..

      - name: Wait for Target API to be Fully Available
        run: |
          for i in {1..40}; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0 || echo "000")
            if [ "$HTTP_STATUS" != "000" ] && [ "$HTTP_STATUS" != "404" ] && [ "$HTTP_STATUS" != "503" ]; then
              break
            fi
            sleep 4
          done

      - name: Print API Logs on Failure Startup
        if: failure() || always()
        run: |
          if [ -f app.log ]; then
            cat app.log
          fi

      - name: Execute RestAssured Automation Tests
        run: mvn clean test
        continue-on-error: true

      - name: Collect Allure Executions History
        uses: actions/checkout@v4
        if: always()
        with:
          ref: gh-pages
          path: gh-pages-dir
        continue-on-error: true

      - name: Build Allure Dashboard Structure
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          allure_results: target/allure-results
          allure_history: allure-history
          keep_reports: 20

      - name: Publish Dashboard Webpage
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-history
          publish_branch: gh-pages
