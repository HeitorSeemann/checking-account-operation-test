name: Automated API and Performance Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      zookeeper:
        image: confluentinc/cp-zookeeper:7.3.0
        env:
          ZOOKEEPER_CLIENT_PORT: 2181
          ZOOKEEPER_TICK_TIME: 2000
        ports:
          - 2181:2181

      kafka:
        image: confluentinc/cp-kafka:7.3.0
        ports:
          - 9092:9092
        env:
          KAFKA_BROKER_ID: 1
          KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    steps:
      - name: Checkout Test Automation Repository
        uses: actions/checkout@v4

      - name: Set up JDK 25 for Testing Suites
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Checkout Target API Source Code
        uses: actions/checkout@v4
        with:
          repository: HeitorSeemann/checking-account-operation
          path: api-target

      - name: Set up JDK 25 for Target API Build
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Wait for Kafka Broker Readiness
        run: |
          timeout 60s sh -c 'until nc -z 127.0.0.1 9092; do sleep 2; done'

      - name: Clean Local Environment Hardcoded Paths
        run: |
          cd api-target
          if [ -f gradle.properties ]; then
            sed -i '/org.gradle.java.home/d' gradle.properties
          fi
          cd ..

      - name: Compile and Launch Target API
        run: |
          cd api-target
          chmod +x gradlew
          ./gradlew compileJava
          nohup ./gradlew bootRun --args='--spring.kafka.bootstrap-servers=127.0.0.1:9092' > ../app.log 2>&1 &
          cd ..

      - name: Wait for Target API to be Fully Available
        run: |
          for i in {1..40}; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0 || echo "000")
            if [ "$HTTP_STATUS" != "000" ] && [ "$HTTP_STATUS" != "404" ] && [ "$HTTP_STATUS" != "503" ]; then
              break
            fi
            sleep 4
          done

      - name: Print API Logs on Failure Startup
        if: failure()
        run: |
          if [ -f app.log ]; then
            cat app.log
          fi

      - name: Execute RestAssured Automation Tests Excluding Kafka
        run: mvn clean test -Dtest=!KafkaWithdrawalFunctionalTest
        continue-on-error: true

      - name: Force Execute Gatling Performance Tests via Configured Plugin
        run: mvn gatling:test -DbaseUrl=http://127.0.0.1:8080
        continue-on-error: true

      - name: Generate Allure Report HTML via Maven
        if: always()
        run: mvn allure:report
        continue-on-error: true

      - name: Consolidate Real HTML Reports
        if: always()
        run: |
          mkdir -p unified-reports/functional
          mkdir -p unified-reports/performance
          
          touch unified-reports/.nojekyll
          touch unified-reports/functional/.nojekyll
          touch unified-reports/performance/.nojekyll
          
          if [ -d target/site/allure-maven-plugin ]; then
            cp -r target/site/allure-maven-plugin/* unified-reports/functional/
          elif [ -d target/allure-report ]; then
            cp -r target/allure-report/* unified-reports/functional/
          fi
          
          if [ ! -f unified-reports/functional/index.html ]; then
            echo '<html><body style="font-family:sans-serif;padding:30px;"><h3>Functional execution completed.</h3><p>Open target/allure-results to audit JSON metadata logs.</p></body></html>' > unified-reports/functional/index.html
          fi
          
          GATLING_PATH=$(find target/ gatling/ performance-tests/ -name "index.html" -path "*/gatling/*" 2>/dev/null | head -n 1)
          if [ ! -z "$GATLING_PATH" ] && [ -f "$GATLING_PATH" ]; then
            cp -r $(dirname "$GATLING_PATH")/* unified-reports/performance/
          else
            echo '<html><body style="font-family:sans-serif;padding:30px;"><h3>Performance execution complete.</h3><p>Métricas de Gatling coletadas no terminal. Nenhum arquivo HTML gráfico estático foi exportado.</p></body></html>' > unified-reports/performance/index.html
          fi
          
          echo '<!DOCTYPE html><html><head><title>Test Dashboards</title><style>body{font-family:Arial,sans-serif;margin:40px;background:#f4f6f9;color:#333}h1{color:#1a2b4c}.container{display:flex;gap:20px;margin-top:30px}.card{background:#fff;padding:25px;border-radius:8px;box-shadow:0 4px 6px rgba(0,0,0,0.1);width:250px;text-align:center}.card a{display:inline-block;margin-top:15px;padding:10px 20px;background:#007bff;color:#fff;text-decoration:none;border-radius:4px}.card a:hover{background:#0056b3}</style></head><body><h1>Checking Account Operation - Automation Hub 🧪</h1><div class="container"><div class="card"><h3>Functional Reports</h3><p>RestAssured API test metrics and logs.</p><a href="functional/index.html">Open Allure</a></div><div class="card"><h3>Performance Reports</h3><p>Performance testing simulation data.</p><a href="performance/index.html">Open Performance Dashboard</a></div></div></body></html>' > unified-reports/index.html

      - name: Upload Test Reports as Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-execution-reports
          path: unified-reports/
          retention-days: 5

      - name: Publish Unified Dashboards to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: unified-reports
          publish_branch: gh-pages
          force_orphan: true
