name: E2E Integration Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Baixa o código do repositório atual (Automação de Testes)
      - name: Checkout Testing Repo
        uses: actions/checkout@v4

      # 2. Baixa o código da API principal (Checking Account Operation)
      - name: Checkout Main API Repo
        uses: actions/checkout@v4
        with:
          repository: HeitorSeemann/checking-account-operation
          path: main-api

      # 3. Configura o ambiente Java necessário para buildar o projeto principal
      - name: Setup Java for Main API
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      # 4. Executa o build do projeto Spring forçando o uso do Java 11
      - name: Build Main API (Generate JAR)
        run: |
          cd main-api
          chmod +x ./gradlew
          ./gradlew bootJar
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_11_X64 }}

      # 5. Sobe o Kafka e os serviços necessários via Docker
      - name: Start Kafka and API Services
        run: |
          cd main-api
          if [ -f docker-compose.yml ]; then
            # Tenta mitigar o erro 500 fazendo um pull prévio com retry automático se falhar
            echo "Tentando baixar as imagens do docker-compose..."
            docker compose pull || echo "Falha no pull inicial, tentando subir diretamente..."
            docker compose up -d
          else
            echo "Docker compose não encontrado no projeto principal."
            exit 1
          fi

      # 6. Aguarda o Kafka e a API ficarem saudáveis
      - name: Wait for services to be ready
        run: |
          echo "Aguardando inicialização dos serviços..."
          sleep 20

      # 7. Configura o ambiente para rodar os seus testes
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 8. Instala as dependências e roda a automação de teste
      - name: Run Automation Tests
        run: |
          npm install
          npm test
        env:
          API_URL: http://localhost:8080
          KAFKA_BROKERS: localhost:9092
