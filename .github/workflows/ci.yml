name: Automated API Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Start Application Infrastructure
        run: |
          if [ -f docker-compose.yml ]; then
            docker compose up -d
          elif [ -f docker/docker-compose.yml ]; then
            docker compose -f docker/docker-compose.yml up -d
          elif [ -d performance-tests ]; then
            docker compose up -d || true
          fi

      - name: Wait for API to be fully ready
        run: |
          echo "Waiting for API endpoints to become available..."
          timeout 90s sh -c 'until curl -f http://localhost:8080/actuator/health || curl -f http://localhost:8080/health || curl -f http://127.0.0; do sleep 5; done' || echo "Proceeding to tests, target may be slow..."

      - name: Run tests
        run: mvn clean test
        continue-on-error: true

      - name: Stop Application Infrastructure
        if: always()
        run: |
          if [ -f docker-compose.yml ]; then
            docker compose down
          elif [ -f docker/docker-compose.yml ]; then
            docker compose -f docker/docker-compose.yml down
          fi

      - name: Get Allure history
        uses: actions/checkout@v4
        if: always()
        with:
          ref: gh-pages
          path: gh-pages-dir
        continue-on-error: true

      - name: Generate Allure Report
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          allure_results: target/allure-results
          allure_history: allure-history
          keep_reports: 20

      - name: Deploy Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-history
          publish_branch: gh-pages
