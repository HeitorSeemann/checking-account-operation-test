name: Java CI with Maven

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Automation Tests Repository
        uses: actions/checkout@v4

      - name: Checkout Main Application Repository
        uses: actions/checkout@v4
        with:
          repository: 'HeitorSeemann/checking-account-operation'
          path: 'main-app'

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
          check-latest: true

      - name: Start Infrastructure (Docker Compose)
        run: |
          cd main-app
          docker compose up -d

      - name: Grant execute permission for gradlew
        run: chmod +x main-app/gradlew

      - name: Build and Start Main Service
        run: |
          cd main-app
          ./gradlew bootRun &

      - name: Wait for Spring Boot REST API to be healthy
        run: |
          echo "Aguardando inicialização do microsserviço..."
          timeout 90s bash -c '
          until curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/accounts/withdrawals/1 | grep -q "404"; do
            echo "Serviço ainda não inicializado completamente. Aguardando..."
            sleep 3
          done'
          echo "Microsserviço respondendo com sucesso!"

      - name: Run Automation Tests with Maven
        run: mvn clean test
