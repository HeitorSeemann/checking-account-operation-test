name: Automated API and Performance Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# ... [configuração permissions e jobs omitida para brevidade] ...

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      zookeeper:
        image: confluentinc/cp-zookeeper:7.3.0
        # ... env e ports ...
      kafka:
        image: confluentinc/cp-kafka:7.3.0
        # ... env e ports ...

    steps:
      - name: Checkout Test Automation Repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Checkout Target API Source Code
        uses: actions/checkout@v4
        with:
          repository: HeitorSeemann/checking-account-operation
          path: api-target

      - name: Setup K6 Performance Engine
        uses: grafana/setup-k6-action@v1

      - name: Wait for Kafka Broker
        run: |
          timeout 60s sh -c 'until nc -z 127.0.0.1 9092; do sleep 2; done'

      - name: Compile and Launch Target API
        run: |
          cd api-target
          chmod +x gradlew
          ./gradlew compileJava
          nohup ./gradlew bootRun --args='--spring.kafka.bootstrap-servers=127.0.0.1:9092' > ../app.log 2>&1 &
          cd ..

      - name: Execute RestAssured Automation Tests
        run: mvn clean test -Dtest=!KafkaWithdrawalFunctionalTest
        continue-on-error: true

      - name: Execute K6 Performance Stress Tests
        run: |
          if [ -d performance-tests ]; then
            cd performance-tests
            K6_SCRIPT=$(find . -name "*.js" | head -n 1)
            if [ ! -z "$K6_SCRIPT" ]; then
              sed -i 's/localhost:8080/127.0.0.1:8080/g' "$K6_SCRIPT"
              k6 run "$K6_SCRIPT" > ../k6-results.log 2>&1 || true
            fi
            cd ..
          fi
        continue-on-error: true

      - name: Generate Allure Report
        if: always()
        run: mvn allure:report
        continue-on-error: true

      - name: Consolidate Real HTML Reports
        if: always()
        run: |
          mkdir -p unified-reports/functional
          mkdir -p unified-reports/performance
          # ... [cp e echo reports] ...
          echo '<!DOCTYPE html><html>...</html>' > unified-reports/index.html

      - name: Upload Test Reports as Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-execution-reports
          path: unified-reports/
          retention-days: 5

      - name: Publish Unified Dashboards to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: unified-reports
          publish_branch: gh-pages
          force_orphan: true
