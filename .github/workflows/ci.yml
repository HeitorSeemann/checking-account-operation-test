name: Automated API and Performance Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      zookeeper:
        image: confluentinc/cp-zookeeper:7.3.0
        env:
          ZOOKEEPER_CLIENT_PORT: 2181
          ZOOKEEPER_TICK_TIME: 2000
        ports:
          - 2181:2181

      kafka:
        image: confluentinc/cp-kafka:7.3.0
        ports:
          - 9092:9092
        env:
          KAFKA_BROKER_ID: 1
          KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    steps:
      - name: Checkout Test Automation Repository
        uses: actions/checkout@v4

      - name: Set up JDK 25 for Testing Suites
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Checkout Target API Source Code
        uses: actions/checkout@v4
        with:
          repository: HeitorSeemann/checking-account-operation
          path: api-target

      - name: Set up JDK 25 for Target API Build
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Wait for Kafka Broker Readiness
        run: |
          timeout 60s sh -c 'until nc -z 127.0.0.1 9092; do sleep 2; done'

      - name: Clean Local Environment Hardcoded Paths
        run: |
          cd api-target
          if [ -f gradle.properties ]; then
            sed -i '/org.gradle.java.home/d' gradle.properties
          fi
          cd ..

      - name: Compile and Launch Target API
        run: |
          cd api-target
          chmod +x gradlew
          ./gradlew compileJava
          nohup ./gradlew bootRun --args='--spring.kafka.bootstrap-servers=127.0.0.1:9092' > ../app.log 2>&1 &
          cd ..

      - name: Wait for Target API to be Fully Available
        run: |
          for i in {1..40}; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0 || echo "000")
            if [ "$HTTP_STATUS" != "000" ] && [ "$HTTP_STATUS" != "404" ] && [ "$HTTP_STATUS" != "503" ]; then
              break
            fi
            sleep 4
          done

      - name: Print API Logs on Failure Startup
        if: always()
        run: |
          if [ -f app.log ]; then
            cat app.log
          fi

      - name: Execute RestAssured Automation Tests Excluding Kafka
        run: mvn clean test -Dtest=!KafkaWithdrawalFunctionalTest
        continue-on-error: true

      - name: Execute Gatling Performance Stress Tests
        run: |
          if [ -d performance-tests ]; then
            cd performance-tests
            if [ -f gradlew ]; then
              chmod +x gradlew
              ./gradlew gatlingRun
            elif [ -f pom.xml ]; then
              mvn gatling:test
            fi
            cd ..
          fi
        continue-on-error: true

      - name: Install Allure CLI and Compile HTML Dashboards
        if: always()
        run: |
          mkdir -p unified-reports/functional
          mkdir -p unified-reports/performance
          
          curl -o allure-commandline.tgz -L https://apache.org
          tar -zxvf allure-commandline.tgz
          export PATH=$PATH:$(pwd)/allure-2.29.0/bin
          
          if [ -d target/allure-results ]; then
            allure generate target/allure-results -o unified-reports/functional --clean
          fi
          
          GATLING_DIR_BUILD=$(find performance-tests/build/reports/gatling -maxdepth 1 -mindepth 1 -type d 2>/dev/null | head -n 1)
          GATLING_DIR_TARGET=$(find performance-tests/target/gatling -maxdepth 1 -mindepth 1 -type d 2>/dev/null | head -n 1)
          
          if [ ! -z "$GATLING_DIR_BUILD" ]; then
            cp -r "$GATLING_DIR_BUILD"/* unified-reports/performance/
          elif [ ! -z "$GATLING_DIR_TARGET" ]; then
            cp -r "$GATLING_DIR_TARGET"/* unified-reports/performance/
          fi

      - name: Publish Unified Dashboards to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: unified-reports
          publish_branch: gh-pages
