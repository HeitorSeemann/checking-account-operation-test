name: Automated API Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      zookeeper:
        image: confluentinc/cp-zookeeper:7.3.0
        env:
          ZOOKEEPER_CLIENT_PORT: 2181
          ZOOKEEPER_TICK_TIME: 2000
        ports:
          - 2181:2181

    steps:
      - name: Checkout Test Automation Repository
        uses: actions/checkout@v4

      - name: Set up JDK 25 for Automation Suite
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Checkout Target API Source Code
        uses: actions/checkout@v4
        with:
          repository: HeitorSeemann/checking-account-operation
          path: api-target

      - name: Set up JDK 25 for Target API Build
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Launch Kafka manually on Host Network
        run: |
          docker run -d --name kafka-host --net=host \
            -e KAFKA_BROKER_ID=1 \
            -e KAFKA_ZOOKEEPER_CONNECT=localhost:2181 \
            -e KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://127.0.0.1:9092 \
            -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT \
            -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
            confluentinc/cp-kafka:7.3.0

      - name: Wait for Kafka and Provision Core Topics
        run: |
          timeout 30s sh -c 'until docker exec kafka-host kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list > /dev/null 2>&1; do sleep 2; done'
          docker exec kafka-host kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --create --topic account-withdrawals --partitions 1 --replication-factor 1 --if-not-exists

      - name: Clean Local Environment Hardcoded Paths
        run: |
          cd api-target
          if [ -f gradle.properties ]; then
            sed -i '/org.gradle.java.home/d' gradle.properties
          fi
          cd ..

      - name: Compile and Launch Target API
        run: |
          cd api-target
          chmod +x gradlew
          ./gradlew compileJava
          nohup ./gradlew bootRun --args='--spring.kafka.bootstrap-servers=127.0.0.1:9092' > ../app.log 2>&1 &
          cd ..

      - name: Wait for Target API to be Fully Available
        run: |
          for i in {1..40}; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0 || echo "000")
            if [ "$HTTP_STATUS" != "000" ] && [ "$HTTP_STATUS" != "404" ] && [ "$HTTP_STATUS" != "503" ]; then
              break
            fi
            sleep 4
          done

      - name: Print API Logs on Failure Startup
        if: failure() || always()
        run: |
          if [ -f app.log ]; then
            cat app.log
          fi

      - name: Execute RestAssured Automation Tests
        run: mvn clean test
        continue-on-error: true

      - name: Collect Allure Executions History
        uses: actions/checkout@v4
        if: always()
        with:
          ref: gh-pages
          path: gh-pages-dir
        continue-on-error: true

      - name: Build Allure Dashboard Structure
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          allure_results: target/allure-results
          allure_history: allure-history
          keep_reports: 20

      - name: Publish Dashboard Webpage
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-history
          publish_branch: gh-pages
