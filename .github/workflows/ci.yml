name: Java CI with Maven

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Start Infrastructure (Docker Compose)
        run: |
          cd checking-account-operation
          docker compose up -d

      - name: Grant execute permission for gradlew
        run: chmod +x checking-account-operation/gradlew

      - name: Build and Start Main Service
        run: |
          cd checking-account-operation
          ./gradlew bootRun &

      - name: Wait for services to be ready
        run: sleep 30

      - name: Run Automation Tests with Maven
        run: mvn clean test
