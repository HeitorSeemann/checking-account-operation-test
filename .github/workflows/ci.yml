name: Automated API Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Test Automation Repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Clone Target API Source Code
        run: git clone https://github.com api-target

      - name: Setup Gradle for Target API
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build and Launch Target API
        run: |
          cd api-target
          chmod +x gradlew
          ./gradlew bootJar
          docker compose up --build -d
          cd ..

      - name: Wait for Target API to be fully operational
        run: |
          timeout 90s sh -c 'until curl -f http://localhost:8080/accounts/withdrawals/1001 || curl -f http://localhost:8080/actuator/health || curl -f http://127.0.0; do sleep 5; done' || echo "Proceeding to testing suite..."

      - name: Run test automation suite
        run: mvn clean test
        continue-on-error: true

      - name: Tear Down Infrastructure Environment
        if: always()
        run: |
          if [ -d api-target ]; then
            cd api-target
            docker compose down || true
            cd ..
          fi

      - name: Get Allure history
        uses: actions/checkout@v4
        if: always()
        with:
          ref: gh-pages
          path: gh-pages-dir
        continue-on-error: true

      - name: Generate Allure Report
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          allure_results: target/allure-results
          allure_history: allure-history
          keep_reports: 20

      - name: Deploy Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-history
          publish_branch: gh-pages
