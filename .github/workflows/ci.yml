# 2. Baixa o código da API principal (Checking Account Operation)
- name: Checkout Main API Repo
  uses: actions/checkout@v4
  with:
    repository: HeitorSeemann/checking-account-operation
    path: main-api

# NOVO: Configura o ambiente Java necessário para buildar o projeto principal
- name: Setup Java for Main API
  uses: actions/setup-java@v4
  with:
    distribution: 'temurin' # Ou a distribuição de sua preferência
    java-version: '17'      # Ajuste para a versão exata do seu projeto (17, 21, etc.)

# NOVO: Executa o build do projeto Spring para gerar o arquivo .jar
- name: Build Main API (Generate JAR)
  run: |
    cd main-api
    chmod +x ./gradlew
    ./gradlew bootJar # Usa 'build -x test' se preferir pular os testes unitários dele aqui

# 3. Agora sim, sobe os serviços com o Docker Compose
- name: Start Kafka and API Services
  run: |
    cd main-api
    docker compose up -d
