name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tests repository
        uses: actions/checkout@v4

      - name: Checkout main microservice
        uses: actions/checkout@v4
        with:
          repository: 'HeitorSeemann/checking-account-operation'
          path: 'checking-account-operation'

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build microservice
        run: |
          cd checking-account-operation
          ./gradlew bootJar

      - name: Start Infrastructure
        run: |
          docker-compose up -d

      - name: Run Automation Tests
        run: |
          mvn clean test
