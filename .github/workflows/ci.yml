name: Automated API and Performance Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      zookeeper:
        image: confluentinc/cp-zookeeper:7.3.0
        env:
          ZOOKEEPER_CLIENT_PORT: 2181
          ZOOKEEPER_TICK_TIME: 2000
        ports:
          - 2181:2181

      kafka:
        image: confluentinc/cp-kafka:7.3.0
        ports:
          - 9092:9092
        env:
          KAFKA_BROKER_ID: 1
          KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    steps:
      - name: Checkout Test Automation Repository
        uses: actions/checkout@v4

      - name: Set up JDK 25 for Testing Suites
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Checkout Target API Source Code
        uses: actions/checkout@v4
        with:
          repository: HeitorSeemann/checking-account-operation
          path: api-target

      - name: Set up JDK 25 for Target API Build
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Wait for Kafka Broker Readiness
        run: |
          timeout 60s sh -c 'until nc -z 127.0.0.1 9092; do sleep 2; done'

      - name: Clean Local Environment Hardcoded Paths
        run: |
          cd api-target
          if [ -f gradle.properties ]; then
            sed -i '/org.gradle.java.home/d' gradle.properties
          fi
          cd ..

      - name: Compile and Launch Target API
        run: |
          cd api-target
          chmod +x gradlew
          ./gradlew compileJava
          nohup ./gradlew bootRun --args='--spring.kafka.bootstrap-servers=127.0.0.1:9092' > ../app.log 2>&1 &
          cd ..

      - name: Wait for Target API to be Fully Available
        run: |
          for i in {1..40}; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0 || echo "000")
            if [ "$HTTP_STATUS" != "000" ] && [ "$HTTP_STATUS" != "404" ] && [ "$HTTP_STATUS" != "503" ]; then
              break
            fi
            sleep 4
          done

      - name: Print API Logs on Failure Startup
        if: failure()
        run: |
          if [ -f app.log ]; then
            cat app.log
          fi

      - name: Execute RestAssured Automation Tests Excluding Kafka
        run: mvn clean test -Dtest=!KafkaWithdrawalFunctionalTest
        continue-on-error: true

      - name: Execute Gatling Performance Stress Tests
        run: |
          if [ -d performance-tests ]; then
            cd performance-tests
            if [ -f gradlew ]; then
              chmod +x gradlew
              ./gradlew gatlingRun
            elif [ -f pom.xml ]; then
              mvn gatling:test
            fi
            cd ..
          fi
        continue-on-error: true

      - name: Load Historical Metrics from Pages
        uses: actions/checkout@v4
        if: always()
        with:
          ref: gh-pages
          path: gh-pages-dir
        continue-on-error: true

      - name: Compile Allure Functional HTML Dashboard
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          allure_results: target/allure-results
          allure_report: functional
          allure_history: allure-history
          keep_reports: 20

      - name: Consolidate Performance Reports and Create Index Menu
        if: always()
        run: |
          mkdir -p functional
          mkdir -p performance
          
          if [ -d allure-history ]; then
            cp -r allure-history/* functional/
          fi
          
          GATLING_DIR_BUILD=$(find performance-tests/build/reports/gatling -maxdepth 1 -mindepth 1 -type d 2>/dev/null | head -n 1)
          GATLING_DIR_TARGET=$(find performance-tests/target/gatling -maxdepth 1 -mindepth 1 -type d 2>/dev/null | head -n 1)
          
          if [ ! -z "$GATLING_DIR_BUILD" ]; then
            cp -r "$GATLING_DIR_BUILD"/* performance/
          elif [ ! -z "$GATLING_DIR_TARGET" ]; then
            cp -r "$GATLING_DIR_TARGET"/* performance/
          fi
          
          cat << 'EOF' > index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Checking Account Automation Dashboards</title>
              <style>
                  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 40px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 80vh; }
                  h1 { color: #1e293b; margin-bottom: 30px; font-size: 2.5rem; text-align: center; }
                  .container { display: flex; gap: 30px; max-width: 900px; width: 100%; flex-wrap: wrap; justify-content: center; }
                  .card { background: white; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06); padding: 30px; text-align: center; flex: 1; min-width: 280px; max-width: 400px; transition: transform 0.2s, box-shadow 0.2s; text-decoration: none; color: inherit; }
                  .card:hover { transform: translateY(-5px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05); }
                  .icon { font-size: 3rem; margin-bottom: 15px; }
                  .card h2 { color: #0f172a; margin: 0 0 10px 0; font-size: 1.5rem; }
                  .card p { color: #64748b; margin: 0; font-size: 1rem; line-height: 1.5; }
              </style>
          </head>
          <body>
              <h1>Checking Account Automation Dashboards 🧪</h1>
              <div class="container">
                  <a href="./functional/" class="card">
                      <div class="icon">📊</div>
                      <h2>Functional API Reports</h2>
                      <p>View RestAssured interactive execution graphs, historical evolution, and error classifications via Allure.</p>
                  </a>
                  <a href="./performance/" class="card">
                      <div class="icon">⚡</div>
                      <h2>Performance Stress Reports</h2>
                      <p>Analyze microservice resilience, response time percentiles, and request-per-second capacities via Gatling.</p>
                  </a>
              </div>
          </body>
          </html>
          EOF

      - name: Publish Unified Dashboards to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          keep_files: false
